<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#062f73;--blue:#0648ad;--orange:#ff941f;--ink:#12243d;--muted:#5a6b82;--line:#dbe5f3;--pale:#eef4ff;--bg:#f4f7fc}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Open Sans',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Poppins',system-ui,Arial;margin:0}
button{font:inherit}
.boot{padding:70px 20px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#eef4ff,#f6f9fd)}
.logincard{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 20px 50px rgba(8,40,90,.1)}
.logincard h1{font-size:1.35rem;color:var(--navy);margin-bottom:6px}
.logincard>p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.topin{width:min(1120px,calc(100% - 32px));margin:auto;display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font:600 15px 'Poppins';min-width:0}
.brand .pip{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:0 0 auto}
.brand .muted{color:#a9c4e6;font-weight:400;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topactions{margin-left:auto;display:flex;gap:8px}
.tabs{position:sticky;top:60px;z-index:25;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:8px 0;overflow-x:auto;justify-content:center}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.tabs button:hover{background:var(--pale)}
.tabs button.on{background:var(--navy);color:#fff}
.main{width:min(1120px,calc(100% - 32px));margin:24px auto 90px}
.tabhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.tabhead h2{font-size:1.3rem;color:var(--navy)}
.tabhead p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:620px}
.tabactions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none}
.btn:hover{border-color:#b9cce6}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#20160a}
.btn.primary:hover{background:#ffa83f}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.small{min-height:34px;padding:0 12px;font-size:12.5px}
.btn.danger{color:#b3261e;border-color:#f0cdc9}
.btn.wide{width:100%;min-height:46px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.cardhead{padding:16px 18px 0}
.cardhead h3{font-size:1rem;color:var(--navy)}
.cardhead p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.cardbody{padding:16px 18px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#43566f;margin-bottom:10px}
.fld input,.fld select,.fld textarea{font:14px/1.5 'Open Sans';font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #9cc0ff;outline-offset:1px;border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:76px}
.fld .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:#2b3f57;cursor:pointer;margin:6px 0}
.chk input{width:17px;height:17px;accent-color:var(--blue)}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fbfdff}
.rephead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rephead strong{font:600 13.5px 'Poppins';color:var(--navy)}
.rephead .tools{margin-left:auto;display:flex;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgfield{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;margin-bottom:12px}
.thumb{aspect-ratio:4/3;border:1px dashed #b9cce6;border-radius:10px;background:#f2f7ff center/cover no-repeat;display:grid;place-items:center;color:#8aa2c0;font-size:11px;overflow:hidden}
.thumb.empty::after{content:'No image'}
.imgctl{display:grid;gap:8px}
.imgctl .fld{margin-bottom:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.pagegrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.pagelist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:3px;position:sticky;top:132px;max-height:calc(100vh - 160px);overflow:auto}
.pagelist button{text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#2b3f57}
.pagelist button:hover{background:var(--pale)}
.pagelist button.on{background:var(--navy);color:#fff}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 6px 8px;font-weight:700}
.tbl td{padding:6px;vertical-align:top;border-top:1px solid var(--line)}
.tbl input,.tbl select{width:100%;font:13px 'Open Sans';border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
.tbl .narrow{width:150px}
.tbl .tiny{width:66px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b2d63;color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 14px 34px rgba(8,40,90,.28);z-index:80;max-width:92vw}
.toast.err{background:#8e1f18}
.toast.ok{background:#0d5b36}
.err{color:#b3261e;font-size:13px;margin:12px 0 0}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.emptybox{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
@media(max-width:860px){.grid2,.grid3,.row3,.pagegrid{grid-template-columns:1fr}.pagelist{position:static;flex-direction:row;flex-wrap:wrap;max-height:none}.imgfield{grid-template-columns:110px 1fr}.tabs{justify-content:flex-start;padding:8px 16px}.tabactions{margin-left:0;width:100%}}
</style>
<script>
var TOKEN = localStorage.getItem('apmerge_token') || '';
var DB = null, SITE_URL = '', TAB = 'homepage', DIRTY = false, PAGE_INDEX = 0;
var COLLECT = {};

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function errText(e) { return (e && (e.message || e)) || 'Something went wrong.'; }

var toastTimer = null;
function toast(message, kind) {
  var box = $('#toast');
  box.textContent = message;
  box.className = 'toast' + (kind ? ' ' + kind : '');
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { box.hidden = true; }, 4200);
}

function call(name, args, done) {
  var runner = google.script.run
    .withSuccessHandler(function (r) { if (done) done(r); })
    .withFailureHandler(function (e) { toast(errText(e), 'err'); });
  runner[name].apply(runner, args || []);
}

function setPath(obj, path, value) {
  var keys = path.split('.');
  var cur = obj;
  for (var i = 0; i < keys.length - 1; i++) {
    var k = /^\d+$/.test(keys[i]) ? Number(keys[i]) : keys[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    cur = cur[k];
  }
  var last = keys[keys.length - 1];
  cur[/^\d+$/.test(last) ? Number(last) : last] = value;
}

/** Reads every [data-path] field under root into a copy of base. */
function collect(root, base) {
  var out = JSON.parse(JSON.stringify(base));
  $$('[data-path]', root).forEach(function (field) {
    var value = field.type === 'checkbox' ? field.checked : field.value;
    setPath(out, field.dataset.path, value);
  });
  return out;
}

function imgSrc(value) {
  var v = String(value || '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) {
    var m = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=|thumbnail\?id=)|docs\.google\.com\/[^/]+\/d\/)([A-Za-z0-9_-]{20,})/.exec(v);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600' : v;
  }
  return /^[A-Za-z0-9_-]{20,}$/.test(v) ? 'https://drive.google.com/thumbnail?id=' + v + '&sz=w600' : '';
}

function setThumb(path, value) {
  var thumb = $('[data-thumb="' + path + '"]');
  if (!thumb) return;
  var src = imgSrc(value);
  thumb.style.backgroundImage = src ? 'url("' + src + '")' : '';
  thumb.classList.toggle('empty', !src);
}

/* ---- small building blocks ---- */

function card(title, body, note) {
  return '<div class="card"><div class="cardhead"><h3>' + esc(title) + '</h3>' +
    (note ? '<p>' + esc(note) + '</p>' : '') + '</div><div class="cardbody">' + body + '</div></div>';
}
function field(label, path, value, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span><input data-path="' + path + '" value="' + esc(value) + '"' +
    (hint ? ' placeholder="' + esc(hint) + '"' : '') + '></label>';
}
function area(label, path, value, rows, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span><textarea rows="' + (rows || 3) + '" data-path="' + path + '">' +
    esc(value) + '</textarea>' + (hint ? '<em class="hint">' + esc(hint) + '</em>' : '') + '</label>';
}
function check(label, path, on) {
  return '<label class="chk"><input type="checkbox" data-path="' + path + '"' + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
}
function pageSelect(label, path, value, hint) {
  var options = ['<option value="">Homepage</option>'];
  (DB.pages || []).forEach(function (p) {
    options.push('<option value="' + esc(p.key) + '"' + (p.key === value ? ' selected' : '') + '>' + esc(p.title) + '</option>');
  });
  return '<label class="fld"><span>' + esc(label) + '</span><select data-path="' + path + '">' + options.join('') + '</select>' +
    (hint ? '<em class="hint">' + esc(hint) + '</em>' : '') + '</label>';
}
function imageField(label, path, value) {
  return '<div class="imgfield">' +
    '<div class="thumb' + (imgSrc(value) ? '' : ' empty') + '" data-thumb="' + path + '"' +
    (imgSrc(value) ? ' style="background-image:url(&quot;' + imgSrc(value) + '&quot;)"' : '') + '></div>' +
    '<div class="imgctl">' +
    '<label class="fld"><span>' + esc(label) + '</span>' +
    '<input data-path="' + path + '" value="' + esc(value) + '" placeholder="Drive link, file ID or image URL">' +
    '<em class="hint">Paste any Google Drive share link, or upload a photo. Landscape images work best (1600×900).</em></label>' +
    '<div class="btnrow"><button type="button" class="btn small" data-upload="' + path + '">Upload image</button>' +
    '<button type="button" class="btn small" data-clear="' + path + '">Clear</button></div>' +
    '</div></div>';
}

/* ---- image upload ---- */

function pickImage(cb) {
  var picker = $('#picker');
  picker.value = '';
  picker.onchange = function () {
    var file = picker.files[0];
    if (file) shrinkImage(file, 2000, cb);
  };
  picker.click();
}

function shrinkImage(file, max, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 700000) return cb(String(reader.result), file.name);
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85), file.name);
    };
    img.onerror = function () { toast('That file is not an image.', 'err'); };
    img.src = String(reader.result);
  };
  reader.onerror = function () { toast('Could not read that file.', 'err'); };
  reader.readAsDataURL(file);
}

/* ---- app flow ---- */

function showLogin(message) {
  $('#boot').hidden = true;
  $('#app').hidden = true;
  $('#login').hidden = false;
  if (message) {
    $('#loginErr').textContent = message;
    $('#loginErr').hidden = false;
  }
  var pw = $('#pw');
  if (pw) pw.focus();
}

function loadAll() {
  call('apiLoad', [TOKEN], function (r) {
    if (!r || !r.ok) {
      TOKEN = '';
      localStorage.removeItem('apmerge_token');
      return showLogin((r && r.error) || 'Please sign in again.');
    }
    DB = r.data;
    SITE_URL = r.data.siteUrl || '';
    $('#login').hidden = true;
    $('#boot').hidden = true;
    $('#app').hidden = false;
    $('#orgName').textContent = DB.settings.orgName;
    $('#viewSite').href = SITE_URL || '#';
    renderTab('homepage');
  });
}

/** Replaces the local copy with what the server stored, so the form never drifts. */
function applySaved(section, data) {
  if (!data) return;
  if (section === 'homepage') {
    DB.homepage = data;
    if (TAB === 'homepage' && window.renderHomepage) renderHomepage();
  } else if (section === 'pages') {
    DB.pages = data;
    if (PAGE_INDEX >= DB.pages.length) PAGE_INDEX = Math.max(0, DB.pages.length - 1);
    if (TAB === 'pages' && window.renderPages) renderPages();
  } else if (section === 'announcements') {
    DB.announcements = data;
    if (TAB === 'announcements' && window.renderAnnouncements) renderAnnouncements();
  } else if (section === 'settings') {
    DB.settings = data;
    $('#orgName').textContent = DB.settings.orgName;
    if (TAB === 'settings' && window.renderSettings) renderSettings();
  }
  DIRTY = false;
}

function commitCurrent() {
  if (!DB) return;
  if (TAB === 'homepage' && COLLECT.homepage) DB.homepage = COLLECT.homepage();
  else if (TAB === 'pages' && COLLECT.pages) DB.pages = COLLECT.pages();
  else if (TAB === 'announcements' && COLLECT.announcements) DB.announcements = COLLECT.announcements();
  else if (TAB === 'settings' && COLLECT.settings) DB.settings = COLLECT.settings();
}

function renderTab(name) {
  if (name !== TAB) commitCurrent();
  TAB = name;
  DIRTY = false;
  $$('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  $$('.tab').forEach(function (s) { s.hidden = s.id !== 'tab-' + name; });
  if (name === 'homepage' && window.renderHomepage) renderHomepage();
  if (name === 'pages' && window.renderPages) renderPages();
  if (name === 'announcements' && window.renderAnnouncements) renderAnnouncements();
  if (name === 'settings' && window.renderSettings) renderSettings();
  window.scrollTo({ top: 0 });
}

/* ---- events ---- */

document.addEventListener('input', function (e) {
  DIRTY = true;
  var field = e.target.closest ? e.target.closest('[data-path]') : null;
  if (field && /(^|\.)(image|logo|banner|photo)$/.test(field.dataset.path)) setThumb(field.dataset.path, field.value);
});
document.addEventListener('change', function () { DIRTY = true; });

document.addEventListener('click', function (e) {
  var target = e.target.closest ? e.target : null;

  var tabButton = target && e.target.closest('#tabs button');
  if (tabButton) return renderTab(tabButton.dataset.tab);

  var upload = target && e.target.closest('[data-upload]');
  if (upload) {
    var path = upload.dataset.upload;
    var label = upload.textContent;
    pickImage(function (dataUrl, name) {
      upload.disabled = true;
      upload.textContent = 'Uploading…';
      call('apiUploadImage', [TOKEN, dataUrl, name], function (r) {
        upload.disabled = false;
        upload.textContent = label;
        if (!r || !r.ok) return toast((r && r.error) || 'Upload failed.', 'err');
        var input = $('[data-path="' + path + '"]');
        if (input) {
          input.value = r.id;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
        setThumb(path, r.id);
        toast('Image uploaded. Save this screen to publish it.', 'ok');
      });
    });
    return;
  }

  var clear = target && e.target.closest('[data-clear]');
  if (clear) {
    var clearPath = clear.dataset.clear;
    var clearInput = $('[data-path="' + clearPath + '"]');
    if (clearInput) {
      clearInput.value = '';
      clearInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    setThumb(clearPath, '');
    return;
  }

  var saveButton = target && e.target.closest('[data-save]');
  if (saveButton) {
    var section = saveButton.dataset.save;
    if (!COLLECT[section]) return;
    var payload = COLLECT[section]();
    var original = saveButton.textContent;
    saveButton.disabled = true;
    saveButton.textContent = 'Saving…';
    call('apiSave', [TOKEN, section, payload], function (r) {
      saveButton.disabled = false;
      saveButton.textContent = original;
      if (r && r.ok) {
        applySaved(section, r.data);
        toast('Saved. The live site updates within a minute.', 'ok');
      } else {
        toast((r && r.error) || 'Could not save.', 'err');
      }
    });
    return;
  }

  var preview = target && e.target.closest('[data-preview]');
  if (preview) {
    var url = SITE_URL + (preview.dataset.preview ? '?page=' + encodeURIComponent(preview.dataset.preview) : '');
    window.open(url, '_blank', 'noopener');
  }
});

window.addEventListener('beforeunload', function (e) {
  if (!DIRTY) return;
  e.preventDefault();
  e.returnValue = '';
});

document.addEventListener('DOMContentLoaded', function () {
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var button = this.querySelector('button');
    button.disabled = true;
    button.textContent = 'Signing in…';
    $('#loginErr').hidden = true;
    call('apiSignIn', [$('#pw').value], function (r) {
      button.disabled = false;
      button.textContent = 'Sign in';
      if (r && r.ok) {
        TOKEN = r.token;
        localStorage.setItem('apmerge_token', TOKEN);
        $('#pw').value = '';
        loadAll();
      } else {
        $('#loginErr').textContent = (r && r.error) || 'Could not sign in.';
        $('#loginErr').hidden = false;
      }
    });
  });

  $('#signOut').addEventListener('click', function () {
    call('apiSignOut', [TOKEN], function () {
      TOKEN = '';
      localStorage.removeItem('apmerge_token');
      DB = null;
      showLogin();
    });
  });

  if (!TOKEN) return showLogin();
  call('apiSession', [TOKEN], function (r) {
    if (r && r.ok) loadAll();
    else {
      TOKEN = '';
      localStorage.removeItem('apmerge_token');
      showLogin();
    }
  });
});
</script>
</head>
<body>
<div id="boot" class="boot">Loading the Website Manager…</div>

<div id="login" class="login" hidden>
  <form class="logincard" id="loginForm">
    <h1>Website Manager</h1>
    <p>Sign in to edit the homepage, pages and announcements of the school website.</p>
    <label class="fld"><span>Password</span><input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit">Sign in</button>
    <p class="err" id="loginErr" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar"><div class="topin">
    <div class="brand"><span class="pip" aria-hidden="true"></span><strong>Website Manager</strong><span class="muted" id="orgName"></span></div>
    <div class="topactions">
      <a class="btn ghost" id="viewSite" target="_blank" rel="noopener">View site</a>
      <button class="btn ghost" id="signOut" type="button">Sign out</button>
    </div>
  </div></header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="homepage" class="on">Homepage</button>
    <button type="button" data-tab="pages">Pages</button>
    <button type="button" data-tab="announcements">Announcements</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>

  <main class="main">
    <?!= include('AdminHomepage') ?>
    <?!= include('AdminPages') ?>
    <?!= include('AdminAnnouncements') ?>
    <?!= include('AdminSettings') ?>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<input type="file" id="picker" accept="image/png,image/jpeg,image/webp" hidden>
</body>
</html>
