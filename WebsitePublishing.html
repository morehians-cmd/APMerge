<style>
.wp-wrap{display:grid;gap:16px}.wp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.wp-actions{display:flex;gap:8px;flex-wrap:wrap}.wp-muted{color:var(--mut);font-size:13px}.wp-ver{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:end}.wp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wp-field{display:grid;gap:5px}.wp-field.wide{grid-column:1/-1}.wp-field label{font-size:12px;font-weight:700;color:var(--mut)}.wp-field input,.wp-field textarea,.wp-field select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit}.wp-field textarea{min-height:86px;resize:vertical}.wp-item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.wp-itemhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.wp-avatar{width:58px;height:58px;border-radius:12px;background:var(--surface);background-position:center;background-size:cover;display:grid;place-items:center;font-weight:800;color:var(--mut);border:1px solid var(--line)}.wp-photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.wp-status{font-size:12px;font-weight:700;border-radius:20px;padding:5px 10px;background:var(--surface);color:var(--ink)}.wp-empty{padding:18px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}.wp-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px}.wp-section-title h3{margin:0}.wp-alert{border-left:3px solid var(--orange);padding:10px 12px;background:var(--surface);border-radius:8px;color:var(--mut);font-size:13px}
@media(max-width:760px){.wp-grid,.wp-ver{grid-template-columns:1fr}.wp-field.wide{grid-column:auto}}
</style>
<script>
const WPUI={permissions:{},versions:[],selected:'',username:'',publishingReady:false,publishingBlockers:[],about:null,photoCache:{},photoLoading:{},photoIndex:-1};
const WP_ICONS=['heart','award','users','bulb','shield','book','star','eye','target'];
function websitePublishingPage(){
  head('Website Publishing','Prepare, review, publish and restore approved public website content');
  WPUI.permissions={};WPUI.versions=[];WPUI.selected='';WPUI.about=null;
  $('view').innerHTML='<div class="card"><div class="aemp">Loading website publishing permissions…</div></div>';
  call('getMyWebsitePermissions',[T()],r=>{
    WPUI.permissions=r.data.permissions||{};WPUI.username=String(r.data.username||'').toLowerCase();WPUI.publishingReady=!!(r.data.publishing&&r.data.publishing.publishEndpointEnabled);WPUI.publishingBlockers=(r.data.publishing&&r.data.publishing.blockers)||[];
    if(!Object.keys(WPUI.permissions).some(key=>WPUI.permissions[key]===true)){
      $('view').innerHTML='<div class="card"><h3>Website publishing access</h3><p class="wp-muted">This account has not been assigned website publishing permissions. Ask the System Manager to assign the required individual website permissions.</p></div>';
      return;
    }
    wpUiRefresh();
  });
}
function wpUiCan(key){return WPUI.permissions[key]===true}
function wpUiRefresh(selectId){
  call('listWebsiteVersions',[T()],r=>{
    WPUI.versions=r.data||[];
    if(selectId)WPUI.selected=selectId;
    if(!WPUI.versions.some(v=>v.versionId===WPUI.selected))WPUI.selected=WPUI.versions.length?WPUI.versions[0].versionId:'';
    wpUiRender();
    if(WPUI.selected)wpUiLoad(WPUI.selected);
  });
}
function wpUiSelected(){return WPUI.versions.find(v=>v.versionId===WPUI.selected)||null}
function wpUiRender(){
  const v=wpUiSelected(),p=WPUI.permissions;
  const options=WPUI.versions.map(x=>'<option value="'+esc(x.versionId)+'" '+(x.versionId===WPUI.selected?'selected':'')+'>'+esc(x.status)+' · '+esc(x.versionId)+' · '+esc(x.createdBy)+'</option>').join('');
  const versionCard='<div class="card"><div class="wp-top"><div><h3 style="margin:0">Version workspace</h3><div class="wp-muted">Immutable revisions · independent review · published history</div></div><div class="wp-actions">'+(wpUiCan('website.content.edit')?'<button class="btn" data-act="wpcreate">Create draft</button>':'')+'<button class="btn alt" data-act="wprefresh">Refresh</button></div></div><div class="wp-ver" style="margin-top:14px"><div class="wp-field"><label for="wpVersionSelect">Select version</label><select id="wpVersionSelect">'+(options||'<option value="">No versions yet</option>')+'</select></div><div>'+(v?'<span class="wp-status">'+esc(v.status)+'</span>':'')+'</div></div>'+(v?'<p class="wp-muted">Created by '+esc(v.createdBy)+' · Updated by '+esc(v.updatedBy)+' · '+esc(v.updatedAt||'')+'</p>':'<div class="wp-empty">No website versions are available. Prepare the publishing stores and seed the migration baseline before creating the first draft.</div>')+'</div>';
  let actions='';
  if(v){
    if(['Draft','ChangesRequested'].includes(v.status)&&wpUiCan('website.content.edit'))actions+='<button class="btn" data-act="wpsave">Save About revision</button><button class="btn alt" data-act="wpsubmit">Submit for review</button>';
    if(v.status==='InReview'&&wpUiCan('website.content.review'))actions+='<button class="btn" data-act="wpapprove">Approve</button><button class="btn alt" data-act="wprequest">Request changes</button>';
    if(v.status==='Approved'&&wpUiCan('website.content.publish')&&WPUI.publishingReady)actions+='<button class="btn" data-act="wppublish">Publish approved version</button>';
    if(['Archived','Published'].includes(v.status)&&wpUiCan('website.content.rollback')&&WPUI.publishingReady&&v.status!=='Published')actions+='<button class="btn alt" data-act="wprollback">Restore this version</button>';
  }
  const actionCard=actions?'<div class="wp-actions">'+actions+'</div>':'';
  const editor=WPUI.about?wpUiAboutEditor(v):'';
  const publishGate=!WPUI.publishingReady?'<div class="card"><h3 style="margin-top:0">Publication is safely locked</h3><p class="wp-muted">The draft, review and approval workflow is available, but publishing and rollback remain disabled until all legacy website content and media editors write to immutable drafts.</p><ul>'+WPUI.publishingBlockers.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'';\n  $('view').innerHTML='<div class="wp-wrap">'+publishGate+versionCard+actionCard+editor+'</div>';
  if(WPUI.about)wpUiLoadPhotos();
}
function wpUiSelect(id){WPUI.selected=id;WPUI.about=null;wpUiRender();if(id)wpUiLoad(id)}
function wpUiLoad(id){
  call('getWebsiteDraftAbout',[T(),id],r=>{
    if(WPUI.selected!==id)return;
    WPUI.about=r.data.about||{vision:{title:'',text:''},mission:{title:'',text:''},values:[],leaders:[],timeline:[]};
    wpUiRender();
  });
}
function wpUiField(path,label,value,max,wide,area){
  const id='wp_'+path.replace(/[^A-Za-z0-9_]/g,'_');
  return '<div class="wp-field '+(wide?'wide':'')+'"><label for="'+id+'">'+label+'</label>'+(area?'<textarea id="'+id+'" data-wp="'+path+'" maxlength="'+max+'">'+esc(value||'')+'</textarea>':'<input id="'+id+'" data-wp="'+path+'" maxlength="'+max+'" value="'+esc(value||'')+'">')+'</div>';
}
function wpUiAboutEditor(v){
  const d=WPUI.about,editable=v&&['Draft','ChangesRequested'].includes(v.status)&&wpUiCan('website.content.edit')&&String(v.createdBy||'').toLowerCase()===WPUI.username;
  if(!editable)return '<div class="card"><h3>About Moreh Academy</h3><p class="wp-muted">This version is read-only in its current status. The public reader continues using the currently published version until an approved version is published.</p>'+wpUiAboutReadOnly()+'</div>';
  const values=d.values.map((x,i)=>'<div class="wp-item"><div class="wp-itemhead"><b>Core value '+(i+1)+'</b><button class="btn red" data-act="wpremove" data-v="values|'+i+'">Remove</button></div><div class="wp-grid">'+
    '<div class="wp-field"><label>Icon</label><select data-wp="values.'+i+'.icon">'+WP_ICONS.map(k=>'<option value="'+k+'" '+(x.icon===k?'selected':'')+'>'+k+'</option>').join('')+'</select></div>'+
    wpUiField('values.'+i+'.title','Title',x.title,60,false,false)+wpUiField('values.'+i+'.text','Description',x.text,400,true,true)+'</div></div>').join('');
  const leaders=d.leaders.map((x,i)=>'<div class="wp-item"><div class="wp-itemhead"><b>Leader '+(i+1)+'</b><button class="btn red" data-act="wpremove" data-v="leaders|'+i+'">Remove</button></div><div class="wp-grid">'+
    wpUiField('leaders.'+i+'.name','Full name',x.name,80,false,false)+wpUiField('leaders.'+i+'.title','Position',x.title,80,false,false)+
    wpUiField('leaders.'+i+'.email','Email (optional)',x.email,120,false,false)+wpUiField('leaders.'+i+'.phone','Phone (optional)',x.phone,40,false,false)+
    '<div class="wp-field wide"><label>Profile photo</label><div class="wp-photo"><div class="wp-avatar" data-wpphoto="'+esc(x.photo||'')+'" style="'+(WPUI.photoCache[x.photo]?'background-image:url('+WPUI.photoCache[x.photo]+')':'')+'">'+(WPUI.photoCache[x.photo]?'':esc((x.name||'?').slice(0,1).toUpperCase()))+'</div><button class="btn alt" data-act="wpphoto" data-v="'+i+'">Upload photo</button>'+(x.photo?'<button class="btn red" data-act="wpphotorm" data-v="'+i+'">Remove photo</button>':'')+'</div></div></div></div>').join('');
  const timeline=d.timeline.map((x,i)=>'<div class="wp-item"><div class="wp-itemhead"><b>History milestone '+(i+1)+'</b><button class="btn red" data-act="wpremove" data-v="timeline|'+i+'">Remove</button></div><div class="wp-grid">'+
    wpUiField('timeline.'+i+'.year','Year',x.year,12,false,false)+wpUiField('timeline.'+i+'.title','Milestone title',x.title,100,false,false)+wpUiField('timeline.'+i+'.text','Details',x.text,600,true,true)+'</div></div>').join('');
  return '<div class="card"><div class="wp-top"><div><h3 style="margin:0">Edit About Moreh Academy</h3><div class="wp-muted">Vision · Mission · Core Values · Key Leadership · History</div></div></div><div class="wp-alert" style="margin:12px 0">This editor saves a new immutable draft revision. The legacy About HTML and all other website content are preserved unchanged.</div>'+
    '<div class="wp-grid">'+wpUiField('vision.title','Vision headline',d.vision.title,120,false,false)+wpUiField('mission.title','Mission headline',d.mission.title,120,false,false)+
    wpUiField('vision.text','Vision statement',d.vision.text,1200,true,true)+wpUiField('mission.text','Mission statement',d.mission.text,1200,true,true)+'</div>'+
    '<div class="wp-section-title"><h3>Core Values</h3><button class="btn alt" data-act="wpadd" data-v="values">+ Add value</button></div>'+(values||'<div class="wp-empty">No core values added.</div>')+
    '<div class="wp-section-title"><h3>Key Leadership Team</h3><button class="btn alt" data-act="wpadd" data-v="leaders">+ Add leader</button></div>'+(leaders||'<div class="wp-empty">No leaders added.</div>')+
    '<div class="wp-section-title"><h3>History Timeline</h3><button class="btn alt" data-act="wpadd" data-v="timeline">+ Add milestone</button></div>'+(timeline||'<div class="wp-empty">No history milestones added.</div>')+
    '<input type="file" id="wpPhotoFile" class="hidden" accept="image/jpeg,image/png,image/webp">'+
    '<p class="wp-muted">Save creates a new version; the selected parent remains unchanged. Timeline entries are sorted by year on save.</p></div>';
}
function wpUiAboutReadOnly(){
  const d=WPUI.about;
  return '<div class="wp-grid"><div><b>Vision</b><p>'+esc(d.vision.title)+'</p><p>'+esc(d.vision.text)+'</p></div><div><b>Mission</b><p>'+esc(d.mission.title)+'</p><p>'+esc(d.mission.text)+'</p></div></div>'+
    '<h4>Core Values</h4>'+d.values.map(x=>'<p><b>'+esc(x.title)+'</b> — '+esc(x.text)+'</p>').join('')+
    '<h4>Key Leadership</h4>'+d.leaders.map(x=>'<p><b>'+esc(x.name)+'</b> · '+esc(x.title)+'</p>').join('')+
    '<h4>History</h4>'+d.timeline.map(x=>'<p><b>'+esc(x.year)+' '+esc(x.title)+'</b> — '+esc(x.text)+'</p>').join('');
}
function wpUiCollect(){
  if(!WPUI.about)return;
  document.querySelectorAll('#view [data-wp]').forEach(el=>{
    const p=el.dataset.wp.split('.');let o=WPUI.about;
    for(let i=0;i<p.length-1;i++)o=o[p[i]];
    o[p[p.length-1]]=el.value;
  });
}
function wpUiLoadPhotos(){
  if(!WPUI.about||!WPUI.selected)return;
  WPUI.about.leaders.forEach(leader=>{
    const id=leader.photo;
    if(!id||WPUI.photoCache[id]||WPUI.photoLoading[id])return;
    WPUI.photoLoading[id]=true;
    google.script.run.withSuccessHandler(r=>{
      if(r&&r.success&&r.data){WPUI.photoCache[id]=r.data;const el=document.querySelector('[data-wpphoto="'+id+'"]');if(el)el.style.backgroundImage='url('+r.data+')';if(el)el.textContent=''}
    }).withFailureHandler(()=>{}).getWebsiteDraftAboutPhoto(T(),WPUI.selected,id);
  });
}
function wpUiAdd(kind){
  wpUiCollect();
  const blanks={values:{icon:'star',title:'',text:''},leaders:{name:'',title:'',email:'',phone:'',photo:''},timeline:{year:'',title:'',text:''}};
  const limits={values:8,leaders:12,timeline:12};
  if(!blanks[kind]||WPUI.about[kind].length>=limits[kind])return toast('The '+kind+' limit has been reached.',false);
  WPUI.about[kind].push(blanks[kind]);wpUiRender();
}
function wpUiRemove(value){
  wpUiCollect();const p=value.split('|');if(!WPUI.about[p[0]])return;
  WPUI.about[p[0]].splice(Number(p[1]),1);wpUiRender();
}
function wpUiSave(){
  wpUiCollect();
  call('saveWebsiteDraftAbout',[T(),WPUI.selected,WPUI.about],r=>{
    toast(r.message||'Draft revision saved.');
    wpUiRefresh(r.data.versionId);
  });
}
function wpUiSubmit(){
  call('submitWebsiteDraftForReview',[T(),WPUI.selected],r=>{
    toast(r.message||'Draft submitted.');
    wpUiRefresh(WPUI.selected);
  });
}
function wpUiReview(decision){
  const notes=decision==='RequestChanges'?prompt('Enter the changes required before approval:'):'';
  if(decision==='RequestChanges'&&!String(notes||'').trim())return;
  call('reviewWebsiteDraft',[T(),WPUI.selected,decision,notes||''],r=>{
    toast(r.message||'Review saved.');
    wpUiRefresh(WPUI.selected);
  });
}
function wpUiPublish(){
  if(!confirm('Publish this approved website version? The public homepage and pages will switch to this version.'))return;
  call('publishWebsiteVersion',[T(),WPUI.selected],r=>{
    toast(r.message||'Website version published.');
    wpUiRefresh(WPUI.selected);
  });
}
function wpUiRollback(){
  const reason=prompt('Reason for restoring this archived version:')||'';
  if(!confirm('Restore this version as the current public website?'))return;
  call('rollbackWebsiteVersion',[T(),WPUI.selected,reason],r=>{
    toast(r.message||'Website version restored.');
    wpUiRefresh(WPUI.selected);
  });
}
function wpUiPhoto(index){
  wpUiCollect();WPUI.photoIndex=Number(index);
  const el=$('wpPhotoFile');if(el)el.click();
}
document.addEventListener('change',e=>{
  if(e.target.id==='wpVersionSelect'){wpUiSelect(e.target.value);return}
  if(e.target.id!=='wpPhotoFile')return;
  const file=e.target.files&&e.target.files[0];e.target.value='';
  if(!file||!WPUI.about||WPUI.photoIndex<0)return;
  const index=WPUI.photoIndex,aboutRef=WPUI.about,versionId=WPUI.selected,image=new Image();
  let objectUrl='';
  image.onerror=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);toast('The selected image could not be read.',false)};
  image.onload=()=>{
    if(objectUrl)URL.revokeObjectURL(objectUrl);
    const scale=Math.min(1,600/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
    const dataUrl=canvas.toDataURL('image/jpeg',.86);
    call('stageWebsiteMedia',[T(),dataUrl,file.name||'leader-photo.jpg'],r=>{
      const id=r.data.assetId;
      if(WPUI.about!==aboutRef||WPUI.selected!==versionId||!aboutRef.leaders[index]){
        toast('The image was staged but the selected draft changed before it could be attached.',false);
        return;
      }
      aboutRef.leaders[index].photo=id;WPUI.photoCache[id]=dataUrl;wpUiRender();
    });
  };
  objectUrl=URL.createObjectURL(file);image.src=objectUrl;
});
act.wpcreate=()=>call('createWebsiteDraft',[T()],r=>{toast(r.message);wpUiRefresh(r.data.versionId)});
act.wprefresh=()=>wpUiRefresh(WPUI.selected);
act.wpsave=()=>wpUiSave();
act.wpsubmit=()=>wpUiSubmit();
act.wpapprove=()=>wpUiReview('Approve');
act.wprequest=()=>wpUiReview('RequestChanges');
act.wppublish=()=>wpUiPublish();
act.wprollback=()=>wpUiRollback();
act.wpadd=kind=>wpUiAdd(kind);
act.wpremove=value=>wpUiRemove(value);
act.wpphoto=index=>wpUiPhoto(index);
act.wpphotorm=index=>{wpUiCollect();if(WPUI.about.leaders[index])WPUI.about.leaders[index].photo='';wpUiRender()};
</script>
