name: Apply homepage intro fix
on:
  push:
    paths:
      - homepage-fix.py
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit the files
        run: python3 homepage-fix.py
      - name: Commit and push
        run: |
          git config user.name morehians-cmd
          git config user.email morehians-cmd@users.noreply.github.com
          git add PublicHome.html Public.gs
          git commit -m "Render the homepage intro below the hero and guard empty blocks"
          git push
      - name: Remove the helper
        run: |
          git rm -q homepage-fix.py .github/workflows/apply-homepage-fix.yml
          git commit -m "Remove the temporary homepage fix helper"
          git push
