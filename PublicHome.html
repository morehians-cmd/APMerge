<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<? var site = d.settings, home = d.home; var title = site.orgName + ' | ' + site.motto; var desc = homeDescription_(d); var heroImg = imageUrl_(home.hero.slides[0] && home.hero.slides[0].image, 2048); ?>
<title><?= esc_(title) ?></title>
<meta name="description" content="<?= esc_(desc) ?>">
<meta property="og:type" content="website">
<meta property="og:title" content="<?= esc_(title) ?>">
<meta property="og:description" content="<?= esc_(desc) ?>">
<meta property="og:url" content="<?= esc_(d.base) ?>">
<? if (heroImg) { ?><meta property="og:image" content="<?= esc_(imageUrl_(home.hero.slides[0].image, 1200)) ?>"><? } ?>
<? if (site.schools[0] && imageUrl_(site.schools[0].logo, 64)) { ?><link rel="icon" href="<?= esc_(imageUrl_(site.schools[0].logo, 64)) ?>"><? } ?>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<? if (heroImg) { ?><link rel="preload" as="image" href="<?= esc_(heroImg) ?>"><? } ?>
<?!= include('PublicCss') ?>
<script type="application/ld+json"><?!= JSON.stringify({
  '@context': 'https://schema.org',
  '@type': 'EducationalOrganization',
  name: site.orgName,
  slogan: site.motto,
  url: d.base,
  email: site.contact.email || undefined,
  telephone: site.contact.phone || site.contact.mobile || undefined,
  address: site.contact.address ? { '@type': 'PostalAddress', streetAddress: site.contact.address } : undefined
}).replace(/</g, '\\u003c') ?></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<? if (home.notice.on && home.notice.text) { ?>
<div class="notice"><div class="wrap">
  <span><?= esc_(home.notice.text) ?></span>
  <? if (home.notice.page) { ?><a href="<?= esc_(hrefFor_(d.base, home.notice.page)) ?>">Learn more</a><? } ?>
</div></div>
<? } ?>

<?!= navHtml_(d) ?>

<main id="main">

<? if (home.hero.slides.length) { ?>
<section class="hero" aria-roledescription="carousel" aria-label="Highlights">
  <div class="hero-track" id="heroTrack">
    <? for (var i = 0; i < home.hero.slides.length; i++) { var s = home.hero.slides[i]; var bg = imageUrl_(s.image, 2048); ?>
    <article class="hero-slide<?= bg ? '' : ' plain' ?>"<? if (bg) { ?> style="background-image:url('<?= esc_(bg) ?>')"<? } ?> aria-label="Slide <?= i + 1 ?> of <?= home.hero.slides.length ?>">
      <div class="wrap"><div class="hero-in">
        <? if (s.eyebrow) { ?><p class="hero-eyebrow"><?= esc_(s.eyebrow) ?></p><? } ?>
        <h1><?= esc_(s.title) ?><? if (s.accent) { ?><em><?= esc_(s.accent) ?></em><? } ?></h1>
        <? if (s.subtitle) { ?><p class="hero-sub"><?= esc_(s.subtitle) ?></p><? } ?>
        <? if (s.text) { ?><p class="hero-text"><?= esc_(s.text) ?></p><? } ?>
        <? if (s.primaryLabel || s.secondaryLabel) { ?>
        <div class="actions">
          <? if (s.primaryLabel) { ?><a class="btn" href="<?= esc_(hrefFor_(d.base, s.primaryPage)) ?>"><?= esc_(s.primaryLabel) ?></a><? } ?>
          <? if (s.secondaryLabel) { ?><a class="btn ghost" href="<?= esc_(hrefFor_(d.base, s.secondaryPage)) ?>"><?= esc_(s.secondaryLabel) ?></a><? } ?>
        </div>
        <? } ?>
      </div></div>
    </article>
    <? } ?>
  </div>
  <? if (home.hero.slides.length > 1) { ?>
  <button class="hero-arrow prev" id="heroPrev" aria-label="Previous slide">‹</button>
  <button class="hero-arrow next" id="heroNext" aria-label="Next slide">›</button>
  <div class="hero-dots" id="heroDots" role="tablist" aria-label="Choose a slide">
    <? for (var j = 0; j < home.hero.slides.length; j++) { ?>
    <button type="button" role="tab" aria-label="Go to slide <?= j + 1 ?>"<?= j === 0 ? ' aria-current="true"' : '' ?>></button>
    <? } ?>
  </div>
  <? } ?>
</section>
<? } ?>

<? if (home.values.length) { ?>
<section class="values" aria-label="What we stand for"><div class="wrap"><div class="value-row">
  <? for (var v = 0; v < home.values.length; v++) { var val = home.values[v]; ?>
  <div class="value"><i aria-hidden="true"><?= esc_(val.icon) ?></i><span><?= esc_(val.label) ?></span></div>
  <? } ?>
</div></div></section>
<? } ?>

<section class="wrap split">
  <div class="about">
    <? var aboutImg = imageUrl_(home.about.image, 2048); if (aboutImg) { ?>
    <div class="about-photo"><img src="<?= esc_(aboutImg) ?>" alt="<?= esc_(home.about.title) ?>" loading="lazy" decoding="async" width="640" height="480"></div>
    <? } ?>
    <div>
      <? if (home.about.eyebrow) { ?><p class="eyebrow"><?= esc_(home.about.eyebrow) ?></p><? } ?>
      <h2 class="sec"><?= esc_(home.about.title) ?></h2>
      <? if (home.about.text) { ?><p><?= esc_(home.about.text) ?></p><? } ?>
      <? if (home.about.ctaLabel) { ?><a class="link-more" href="<?= esc_(hrefFor_(d.base, home.about.ctaPage)) ?>"><?= esc_(home.about.ctaLabel) ?> →</a><? } ?>
    </div>
  </div>

  <aside class="updates" aria-labelledby="updatesTitle">
    <div class="updates-head">
      <h2 id="updatesTitle"><?= esc_(home.updates.title) ?></h2>
      <? if (home.updates.ctaLabel) { ?><a href="<?= esc_(hrefFor_(d.base, home.updates.ctaPage)) ?>"><?= esc_(home.updates.ctaLabel) ?></a><? } ?>
    </div>
    <? if (!d.announcements.length) { ?><p class="empty-upd">No announcements yet. Add one in the Website Manager.</p><? } ?>
    <? for (var a = 0; a < Math.min(3, d.announcements.length); a++) { var an = d.announcements[a]; ?>
    <div class="update">
      <div class="date"><?= esc_(an.day) ?><b><?= esc_(an.month) ?></b></div>
      <div>
        <h3><?= esc_(an.title) ?></h3>
        <? if (an.summary) { ?><p><?= esc_(an.summary) ?></p><? } ?>
      </div>
    </div>
    <? } ?>
  </aside>
</section>

<? if (home.band.on && (home.band.title || home.band.label)) { ?>
<section class="band"><div class="wrap band-in">
  <div>
    <h2><?= esc_(home.band.title) ?></h2>
    <? if (home.band.text) { ?><p><?= esc_(home.band.text) ?></p><? } ?>
  </div>
  <? if (home.band.label) { ?><a class="btn" href="<?= esc_(hrefFor_(d.base, home.band.page)) ?>"><?= esc_(home.band.label) ?></a><? } ?>
</div></section>
<? } ?>

</main>

<?!= footerHtml_(d) ?>

<script>
(function () {
  var track = document.getElementById('heroTrack');
  var dots = document.getElementById('heroDots');
  if (!track || !track.children.length) return;
  var slides = track.children;
  var count = slides.length;
  var index = 0;
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = null;

  function paint() {
    if (!dots) return;
    for (var i = 0; i < dots.children.length; i++) {
      if (i === index) dots.children[i].setAttribute('aria-current', 'true');
      else dots.children[i].removeAttribute('aria-current');
    }
  }
  function go(next) {
    index = (next + count) % count;
    track.scrollTo({ left: track.clientWidth * index, behavior: calm ? 'auto' : 'smooth' });
    paint();
  }
  function start() {
    if (calm || count < 2) return;
    stop();
    timer = setInterval(function () { go(index + 1); }, 9000);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  if (dots) {
    for (var d = 0; d < dots.children.length; d++) {
      (function (i) {
        dots.children[i].addEventListener('click', function () { go(i); start(); });
      })(d);
    }
  }
  var prev = document.getElementById('heroPrev');
  var next = document.getElementById('heroNext');
  if (prev) prev.addEventListener('click', function () { go(index - 1); start(); });
  if (next) next.addEventListener('click', function () { go(index + 1); start(); });

  track.addEventListener('scroll', function () {
    var at = Math.round(track.scrollLeft / track.clientWidth);
    if (at !== index && at >= 0 && at < count) { index = at; paint(); }
  }, { passive: true });

  var hero = track.parentElement;
  hero.addEventListener('mouseenter', stop);
  hero.addEventListener('mouseleave', start);
  hero.addEventListener('focusin', stop);
  start();

  /* dropdown menus */
  var items = document.querySelectorAll('.nav-item.has-menu');
  for (var n = 0; n < items.length; n++) {
    (function (item) {
      var toggle = item.querySelector('.nav-toggle');
      if (!toggle) return;
      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        var open = item.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })(items[n]);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = document.querySelectorAll('.nav-item.open');
    for (var i = 0; i < open.length; i++) {
      open[i].classList.remove('open');
      var t = open[i].querySelector('.nav-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
  });

  /* mobile drawer */
  var burger = document.getElementById('burger');
  var drawer = document.getElementById('drawer');
  var closeBtn = document.getElementById('drawer-close');
  function openDrawer() {
    if (!drawer) return;
    drawer.hidden = false;
    if (burger) burger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    if (!drawer) return;
    drawer.hidden = true;
    if (burger) { burger.setAttribute('aria-expanded', 'false'); burger.focus(); }
    document.body.style.overflow = '';
  }
  if (burger) burger.addEventListener('click', openDrawer);
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  if (drawer) drawer.addEventListener('click', function (e) { if (e.target === drawer) closeDrawer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer && !drawer.hidden) closeDrawer(); });
})();
</script>
</body>
</html>
